services:
  - type: web
    name: deepml-sync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so the in-memory rate limiter is shared across all requests
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: APP_KEY
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_URL
        value: https://github.com/karanjajoria
      - key: LINKEDIN_URL
        sync: false
      - key: CREDLY_URL
        sync: false
